[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-lane-residual-model"
version = "0.12.2"
description = "Shared sequence modeling and fail-closed MCAP corpus auditing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
mcap = [
    "mcap>=1.2.1",
    "mcap-protobuf-support>=0.5.2",
    "mcap-ros1-support>=0.7.2",
    "protobuf>=4.25",
]

[project.scripts]
mpr-mcap = "lane_residuals.cli:main"
mpr-probe-path-source = "lane_residuals.path_probe_cli:main"
mpr-validate-path-geometry = "lane_residuals.geometry_validation_cli:main"
mpr-audit-reference-candidates = "lane_residuals.reference_audit_cli:main"
mpr-audit-path-pairing = "lane_residuals.pairing_audit_cli:main"
mpr-audit-edp-transitions = "lane_residuals.edp_transition_audit_cli:main"
mpr-audit-path-pairing-batch = "lane_residuals.batch_pairing_audit_cli:main"
mpr-audit-reference-alignment = "lane_residuals.cli.alignment:main"
mpr-audit-reference-alignment-batch = "lane_residuals.cli.alignment_batch:main"
mpr-train-gaussian-baseline = "lane_residuals.cli.gaussian_baseline:main"
mpr-diagnose-gaussian-baseline = "lane_residuals.cli.gaussian_diagnostics:main"
mpr-audit-conditional-features = "lane_residuals.cli.conditional_features:main"
mpr-train-conditional-gaussian = "lane_residuals.cli.conditional_gaussian:main"
mpr-build-sequential-dataset = "lane_residuals.cli.sequence_dataset:main"
mpr-train-sequence-gaussian = "lane_residuals.cli.sequence_gaussian:main"
mpr-train-sequence-aiohmm = "lane_residuals.cli.sequence_aiohmm:main"
mpr-audit-corpus-inventory = "lane_residuals.cli.corpus_inventory:main"
mpr-audit-native-projection-alignment-batch = "lane_residuals.cli.projection_alignment_batch:main"
mpr-audit-topology-semantics = "lane_residuals.cli.topology_semantics_audit:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lane_residuals*"]
