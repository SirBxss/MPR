name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            dependencies: current
          - python-version: "3.12"
            dependencies: current
          - python-version: "3.12"
            dependencies: frozen-reader
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/mpr-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and MCAP readers
        if: matrix.dependencies == 'current'
        run: python -m pip install --upgrade pip && python -m pip install -e '.[mcap,test]'
      - name: Install frozen reader compatibility dependencies
        if: matrix.dependencies == 'frozen-reader'
        run: >-
          python -m pip install -e '.[mcap,test]'
          'mcap==1.4.0' 'mcap-protobuf-support==0.5.4' 'mcap-ros1-support==0.7.4'
          'numpy==2.5.1' 'protobuf==7.35.1' 'lz4==4.4.5' 'zstandard==0.25.0'
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -t .
